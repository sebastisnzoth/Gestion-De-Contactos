<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#091628" />
    <title>Herramienta bloqueada | Gestión de Contactos</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        background: radial-gradient(circle at 50% 0%, #1a3854 0%, #091628 46%, #040910 100%);
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { width: min(100%, 720px); }
      .mark { width: 64px; height: 64px; margin: 0 auto 30px; border: 1px solid #9bb4cb50; border-radius: 18px; display: grid; place-items: center; background: #ffffff0b; }
      .mark svg { width: 30px; height: 30px; color: #cbd5e1; }
      .status { display: inline-block; color: #f5c86b; letter-spacing: .22em; text-transform: uppercase; font-size: .75rem; font-weight: 700; margin-bottom: 22px; }
      h1 { font-size: clamp(2.15rem, 6vw, 4rem); line-height: 1.12; letter-spacing: -.045em; margin: 0 0 36px; }
      blockquote { margin: 0; font-size: clamp(1.45rem, 4vw, 2.65rem); font-weight: 650; line-height: 1.35; letter-spacing: -.03em; }
      cite { display: block; margin-top: 20px; color: #a8bbcf; font-style: normal; font-size: .98rem; }
      .rule { width: 68px; height: 2px; background: #f5c86b; margin: 42px auto; }
      .final { font-weight: 800; font-size: clamp(1.45rem, 4.4vw, 2.7rem); line-height: 1.35; letter-spacing: -.02em; }
      .final span { display: block; margin-top: 13px; color: #f5c86b; }
      footer { margin-top: 58px; color: #8b9db0; font-size: .8rem; }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <div class="status">Acceso suspendido</div>
      <h1>Herramienta bloqueada</h1>
      <blockquote>“Al Amigo Todo, al enemigo Ni Las Gracias.”</blockquote>
      <cite>Juan Domingo Peron</cite>
      <div class="rule" aria-hidden="true"></div>
      <div class="final">Y Vos Ni mi amiga sos asi que <span>VIVA PERON CARAJO!</span></div>
      <footer>Gestión de Contactos · Acceso deshabilitado</footer>
    </main>
  </body>
</html>
